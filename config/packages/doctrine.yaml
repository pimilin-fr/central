doctrine:
    dbal:
        default_connection: default
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
        connections:
            # « default » reste TOUJOURS le premier : c'est la base de l'application (prod ou démo selon DATABASE_URL).
            default:
                url: '%env(resolve:DATABASE_URL)%'
                schema_filter: ~^(?!v_)~
                mapping_types:
                    uuid: string
                profiling_collect_backtrace: '%kernel.debug%'
            # Cible jetable de app:demo:build. Jamais utilisée en lecture par l'application.
            demo:
                url: '%env(resolve:DEMO_DATABASE_URL)%'
                schema_filter: ~^(?!v_)~
                mapping_types:
                    uuid: string
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
            demo:
                connection: demo
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                demo:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
