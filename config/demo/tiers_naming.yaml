# Noms factices des tiers ANONYMISÉS, selon leur type (N1 / N2 / N3).
# Fichier à enrichir librement : aucune modification de code nécessaire.
# Vérifier la couverture de VOS types :   php bin/console app:demo:types            (--unmatched = seulement ceux sans règle)
#
# Fonctionnement
#  - On cherche d'abord au niveau N3 (le plus précis), puis N2, puis N1. Dans un niveau, la PREMIÈRE règle
#    du fichier qui correspond gagne : mettez les règles précises avant les générales.
#  - keywords : mots (ou suites de mots) cherchés dans le libellé du niveau. Insensible aux accents, à la casse,
#    aux pluriels et à « et / & ». Un « * » final = début de mot (« boulang* » : boulanger, boulangerie…).
#  - names    : modèles de noms, un est choisi (stable) pour chaque tiers. Variables : {prenom} {nom} {lieu}
#               ex. « Boulangerie {nom} » => Boulangerie Martin ; « Pharmacie {lieu} » => Pharmacie du Moulin.
#  - person   : true = le modèle fabrique un nom de personne (« Dr {prenom} {nom} »). Un tiers coché
#               « Personne physique » ne reçoit QUE des règles person: true ; sans règle => « Prénom Nom ».
#  - Sans règle pour une société => nom de société générique.

# La nature (personne / société) vient de la case « Personne physique » du tiers (société par défaut).

rules:
  # ---- Alimentation -------------------------------------------------------
  - keywords: ["boulang*", "patisserie", "viennoiserie"]
    names: ["Boulangerie {nom}", "Fournil {lieu}", "Boulangerie {lieu}", "Au Fournil {lieu}", "Pâtisserie {nom}", "La Mie Dorée {lieu}"]
  - keywords: ["boucherie", "charcuterie", "traiteur", "volaille"]
    names: ["Boucherie {nom}", "Boucherie {lieu}", "Charcuterie {nom}", "Traiteur {nom}"]
  - keywords: ["poissonnerie", "poisson"]
    names: ["Poissonnerie {lieu}", "Poissonnerie {nom}", "La Criée {lieu}"]
  - keywords: ["primeur", "fruit", "legume", "marche"]
    names: ["Primeur {nom}", "Le Jardin {lieu}", "Fruits & Légumes {nom}", "Marché {lieu}"]
  - keywords: ["epicerie", "superette", "proximite", "cave", "vin"]
    names: ["Épicerie {nom}", "Épicerie {lieu}", "Supérette {lieu}", "Cave {nom}"]
  - keywords: ["supermarche", "hypermarche", "grande surface", "course", "alimentation", "drive"]
    names: ["Supermarché {lieu}", "Super {nom}", "Hyper {lieu}", "Marché U {lieu}", "Le Panier {lieu}"]
  - keywords: ["fast food", "restauration rapide", "snack", "kebab", "pizza", "burger", "sandwich"]
